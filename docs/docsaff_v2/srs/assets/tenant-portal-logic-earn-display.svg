<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1580" viewBox="0 0 2200 1580">
  <defs>
    <style>
      .bg{fill:#f6f8fb}
      .title{font:700 30px Arial,sans-serif;fill:#172033}
      .sub{font:15px Arial,sans-serif;fill:#667085}
      .box{fill:#fff;stroke:#cfd8e3;stroke-width:1.8}
      .process{fill:#eefafa;stroke:#0b7185;stroke-width:2}
      .decision{fill:#fff8e8;stroke:#d98a00;stroke-width:2}
      .success{fill:#ecfdf3;stroke:#188456;stroke-width:2}
      .error{fill:#fff3f1;stroke:#cf3f32;stroke-width:2}
      .info{fill:#f0f7ff;stroke:#6d91d0;stroke-width:1.8}
      .disabled{fill:#f2f4f7;stroke:#98a2b3;stroke-width:1.8}
      .h{font:700 17px Arial,sans-serif;fill:#172033}
      .t{font:12px Arial,sans-serif;fill:#52657a}
      .label{font:700 12px Arial,sans-serif;fill:#475467}
      .line{fill:none;stroke:#667085;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
      .goodLine{fill:none;stroke:#188456;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
      .badLine{fill:none;stroke:#cf3f32;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
      .arrow{fill:#667085}.goodArrow{fill:#188456}.badArrow{fill:#cf3f32}
    </style>
  </defs>

  <rect width="2200" height="1580" class="bg"/>
  <text x="60" y="58" class="title">TP-EARN-001 — Earn Display Configuration Logic</text>
  <text x="60" y="88" class="sub">Earn/cashback display list, Brand/Category/Offer configuration and save validation</text>

  <!-- Entry -->
  <rect x="950" y="120" width="300" height="78" rx="14" class="process"/>
  <text x="1100" y="152" text-anchor="middle" class="h">Open Earn display</text>
  <text x="1100" y="176" text-anchor="middle" class="t">Tenant user opens menu</text>

  <path d="M1100 198 L1100 252" class="line"/>
  <path d="M1094 243 L1100 255 L1106 243 Z" class="arrow"/>

  <rect x="900" y="257" width="400" height="82" rx="14" class="process"/>
  <text x="1100" y="289" text-anchor="middle" class="h">Load assigned Brands</text>
  <text x="1100" y="313" text-anchor="middle" class="t">Screen 1 data and controls</text>

  <!-- Top action bus -->
  <path d="M340 430 L1100 430" class="line"/>
  <path d="M1100 339 L1100 430" class="line"/>

  <!-- Filter branch -->
  <path d="M340 430 L340 490" class="line"/>
  <path d="M334 481 L340 493 L346 481 Z" class="arrow"/>
  <rect x="220" y="495" width="240" height="78" rx="14" class="box"/>
  <text x="340" y="527" text-anchor="middle" class="h">Apply filter</text>
  <text x="340" y="551" text-anchor="middle" class="t">Keyword + Config status</text>

  <path d="M340 573 L340 630" class="line"/>
  <path d="M334 621 L340 633 L346 621 Z" class="arrow"/>
  <rect x="220" y="635" width="240" height="78" rx="14" class="info"/>
  <text x="340" y="667" text-anchor="middle" class="h">Refresh list</text>
  <text x="340" y="691" text-anchor="middle" class="t">Keep filter and page scope</text>

  <!-- Configure branch -->
  <path d="M1100 430 L1100 490" class="line"/>
  <path d="M1094 481 L1100 493 L1106 481 Z" class="arrow"/>
  <rect x="980" y="495" width="240" height="78" rx="14" class="box"/>
  <text x="1100" y="527" text-anchor="middle" class="h">Click Configure</text>
  <text x="1100" y="551" text-anchor="middle" class="t">Selected Brand row</text>

  <path d="M1100 573 L1100 630" class="line"/>
  <path d="M1094 621 L1100 633 L1106 621 Z" class="arrow"/>
  <polygon points="1100,635 1230,700 1100,765 970,700" class="decision"/>
  <text x="1100" y="694" text-anchor="middle" class="h">Brand Active?</text>
  <text x="1100" y="718" text-anchor="middle" class="t">And user has permission</text>

  <path d="M970 700 L880 700" class="badLine"/>
  <path d="M890 694 L878 700 L890 706 Z" class="badArrow"/>
  <text x="920" y="687" class="label">No</text>
  <rect x="660" y="660" width="220" height="78" rx="14" class="disabled"/>
  <text x="770" y="692" text-anchor="middle" class="h">Disable Configure</text>
  <text x="770" y="716" text-anchor="middle" class="t">Reject direct API</text>

  <path d="M1100 765 L1100 825" class="goodLine"/>
  <path d="M1094 816 L1100 828 L1106 816 Z" class="goodArrow"/>
  <text x="1114" y="799" class="label">Yes</text>
  <rect x="940" y="830" width="320" height="82" rx="14" class="process"/>
  <text x="1100" y="862" text-anchor="middle" class="h">Open Configure screen</text>
  <text x="1100" y="886" text-anchor="middle" class="t">Tenant + Brand context</text>

  <!-- Level selection bus -->
  <path d="M580 990 L1620 990" class="line"/>
  <path d="M1100 912 L1100 990" class="line"/>
  <path d="M1094 981 L1100 993 L1106 981 Z" class="arrow"/>

  <rect x="460" y="1015" width="240" height="78" rx="14" class="box"/>
  <text x="580" y="1047" text-anchor="middle" class="h">Brand display</text>
  <text x="580" y="1071" text-anchor="middle" class="t">Default selected</text>
  <path d="M580 990 L580 1015" class="line"/>

  <rect x="980" y="1015" width="240" height="78" rx="14" class="box"/>
  <text x="1100" y="1047" text-anchor="middle" class="h">Category display</text>
  <text x="1100" y="1071" text-anchor="middle" class="t">If Category exists</text>
  <path d="M1100 990 L1100 1015" class="line"/>

  <rect x="1500" y="1015" width="240" height="78" rx="14" class="box"/>
  <text x="1620" y="1047" text-anchor="middle" class="h">Offer display</text>
  <text x="1620" y="1071" text-anchor="middle" class="t">If Offer exists</text>
  <path d="M1620 990 L1620 1015" class="line"/>

  <!-- Lower detail/action area compressed through side columns -->
  <rect x="80" y="830" width="300" height="86" rx="14" class="box"/>
  <text x="230" y="862" text-anchor="middle" class="h">Back to earn display list</text>
  <text x="230" y="886" text-anchor="middle" class="t">Confirm if dirty</text>
  <path d="M940 871 L380 871" class="line"/>
  <path d="M392 865 L380 871 L392 877 Z" class="arrow"/>

  <path d="M580 1093 L580 1160 L1100 1160" class="line"/>
  <path d="M1100 1093 L1100 1160" class="line"/>
  <path d="M1620 1093 L1620 1160 L1100 1160" class="line"/>
  <path d="M1100 1160 L1100 1205" class="line"/>
  <path d="M1094 1196 L1100 1208 L1106 1196 Z" class="arrow"/>

  <rect x="970" y="1210" width="260" height="78" rx="14" class="box"/>
  <text x="1100" y="1242" text-anchor="middle" class="h">Save configuration</text>
  <text x="1100" y="1266" text-anchor="middle" class="t">Current target only</text>

  <path d="M1100 1288 L1100 1335" class="line"/>
  <path d="M1094 1326 L1100 1338 L1106 1326 Z" class="arrow"/>
  <polygon points="1100,1340 1230,1405 1100,1470 970,1405" class="decision"/>
  <text x="1100" y="1399" text-anchor="middle" class="h">Valid?</text>
  <text x="1100" y="1423" text-anchor="middle" class="t">Scope, EN/VN, dates</text>

  <path d="M970 1405 L860 1405" class="badLine"/>
  <path d="M870 1399 L858 1405 L870 1411 Z" class="badArrow"/>
  <text x="910" y="1392" class="label">No</text>
  <rect x="620" y="1365" width="240" height="78" rx="14" class="error"/>
  <text x="740" y="1397" text-anchor="middle" class="h">Show errors</text>
  <text x="740" y="1421" text-anchor="middle" class="t">Keep entered values</text>

  <path d="M1230 1405 L1340 1405" class="goodLine"/>
  <path d="M1330 1399 L1342 1405 L1330 1411 Z" class="goodArrow"/>
  <text x="1270" y="1392" class="label">Yes</text>
  <rect x="1340" y="1362" width="280" height="86" rx="14" class="success"/>
  <text x="1480" y="1394" text-anchor="middle" class="h">Save selected target</text>
  <text x="1480" y="1418" text-anchor="middle" class="t">Audit log + refresh UI</text>
</svg>
