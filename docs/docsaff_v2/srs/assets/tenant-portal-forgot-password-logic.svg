<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <style>
    .box{fill:#fff;stroke:#095f78;stroke-width:2}.error{fill:#fff7f6;stroke:#b42318;stroke-width:2}.decision{fill:#eef8f8;stroke:#095f78;stroke-width:2}.txt{font:600 14px Arial,sans-serif;fill:#17212f}.sub{font:12px Arial,sans-serif;fill:#667085}.label{font:700 12px Arial,sans-serif;fill:#095f78}.bad{font:700 12px Arial,sans-serif;fill:#b42318}.arrow{stroke:#667085;stroke-width:2;fill:none;marker-end:url(#arrow)}.error-arrow{stroke:#b42318;stroke-width:2;fill:none;marker-end:url(#error-arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#667085"/></marker>
    <marker id="error-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b42318"/></marker>
  </defs>

  <rect class="box" x="20" y="50" rx="8" width="160" height="76"/>
  <text class="txt" x="100" y="80" text-anchor="middle">Enter Email</text>
  <text class="sub" x="100" y="103" text-anchor="middle">Send OTP by email</text>
  <path class="arrow" d="M180 88H220"/>

  <rect class="box" x="220" y="50" rx="8" width="150" height="76"/>
  <text class="txt" x="295" y="80" text-anchor="middle">Enter OTP</text>
  <text class="sub" x="295" y="103" text-anchor="middle">Click Verify</text>
  <path class="arrow" d="M370 88H402"/>

  <polygon class="decision" points="470,35 538,88 470,141 402,88"/>
  <text class="txt" x="470" y="82" text-anchor="middle">OTP</text>
  <text class="txt" x="470" y="101" text-anchor="middle">valid?</text>

  <path class="arrow" d="M538 88H580"/>
  <text class="label" x="552" y="75">Yes</text>

  <rect class="box" x="580" y="50" rx="8" width="180" height="76"/>
  <text class="txt" x="670" y="80" text-anchor="middle">Create Password</text>
  <text class="sub" x="670" y="103" text-anchor="middle">New + confirmation</text>
  <path class="arrow" d="M760 88H792"/>

  <polygon class="decision" points="870,27 948,88 870,149 792,88"/>
  <text class="txt" x="870" y="74" text-anchor="middle">Required &amp;</text>
  <text class="txt" x="870" y="94" text-anchor="middle">passwords</text>
  <text class="txt" x="870" y="114" text-anchor="middle">match?</text>

  <path class="arrow" d="M948 88H990"/>
  <text class="label" x="963" y="75">Yes</text>
  <rect class="box" x="990" y="50" rx="8" width="180" height="76"/>
  <text class="txt" x="1080" y="80" text-anchor="middle">Reset Success</text>
  <text class="sub" x="1080" y="103" text-anchor="middle">Return to Sign in</text>

  <path class="error-arrow" d="M470 141V190"/>
  <text class="bad" x="482" y="166">No</text>
  <rect class="error" x="380" y="190" rx="8" width="180" height="76"/>
  <text class="txt" x="470" y="220" text-anchor="middle">Show OTP Error</text>
  <text class="sub" x="470" y="241" text-anchor="middle">Invalid OTP or expired OTP</text>
  <text class="sub" x="470" y="258" text-anchor="middle">Highlight + specific message</text>
  <path class="error-arrow" d="M380 228H295V126"/>
  <text class="bad" x="305" y="217">Retry OTP</text>

  <path class="error-arrow" d="M870 149V190"/>
  <text class="bad" x="882" y="172">No</text>
  <rect class="error" x="760" y="190" rx="8" width="220" height="88"/>
  <text class="txt" x="870" y="218" text-anchor="middle">Show Password Error</text>
  <text class="sub" x="870" y="241" text-anchor="middle">Required field or mismatch</text>
  <text class="sub" x="870" y="259" text-anchor="middle">Highlight affected textbox(es)</text>
  <path class="error-arrow" d="M760 234H670V126"/>
  <text class="bad" x="683" y="223">Re-enter passwords</text>

  <rect x="20" y="335" width="1150" height="60" rx="8" fill="#f5f7fa" stroke="#d9e1ea"/>
  <text class="sub" x="45" y="360">Error handling:</text>
  <text class="sub" x="145" y="360">Invalid or expired OTP never advances to Create Password.</text>
  <text class="sub" x="45" y="381">Password validation:</text>
  <text class="sub" x="165" y="381">Empty fields highlight each affected textbox; mismatch highlights Confirm new password.</text>
</svg>
