<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050">
  <defs>
    <style>
      .bg{fill:#f6f8fb}
      .title{font:700 28px Arial,sans-serif;fill:#172033}
      .sub{font:14px Arial,sans-serif;fill:#667085}
      .box{fill:#fff;stroke:#cfd8e3;stroke-width:1.7}
      .process{fill:#eefafa;stroke:#0b7185;stroke-width:2}
      .decision{fill:#fff8e8;stroke:#d98a00;stroke-width:2}
      .success{fill:#ecfdf3;stroke:#188456;stroke-width:2}
      .error{fill:#fff3f1;stroke:#cf3f32;stroke-width:2}
      .info{fill:#f0f7ff;stroke:#6d91d0;stroke-width:1.8}
      .h{font:700 16px Arial,sans-serif;fill:#172033}
      .t{font:12px Arial,sans-serif;fill:#52657a}
      .label{font:700 12px Arial,sans-serif;fill:#475467}
      .line{fill:none;stroke:#667085;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
      .goodLine{fill:none;stroke:#188456;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
      .badLine{fill:none;stroke:#cf3f32;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
      .arrow{fill:#667085}.goodArrow{fill:#188456}.badArrow{fill:#cf3f32}
    </style>
  </defs>

  <rect width="1500" height="1050" class="bg"/>
  <text x="60" y="54" class="title">TP-PROFILE-001 — Profile Management Logic</text>
  <text x="60" y="82" class="sub">Update own profile information and optional password change</text>

  <!-- Main flow -->
  <rect x="590" y="120" width="300" height="76" rx="14" class="process"/>
  <text x="740" y="151" text-anchor="middle" class="h">Open Profile</text>
  <text x="740" y="174" text-anchor="middle" class="t">Account settings &gt; Profile</text>

  <path d="M740 196 L740 250" class="line"/>
  <path d="M734 241 L740 253 L746 241 Z" class="arrow"/>

  <rect x="590" y="255" width="300" height="76" rx="14" class="process"/>
  <text x="740" y="286" text-anchor="middle" class="h">Load current user</text>
  <text x="740" y="309" text-anchor="middle" class="t">User ID from session</text>

  <path d="M740 331 L740 385" class="line"/>
  <path d="M734 376 L740 388 L746 376 Z" class="arrow"/>

  <rect x="590" y="390" width="300" height="82" rx="14" class="box"/>
  <text x="740" y="422" text-anchor="middle" class="h">Edit Profile</text>
  <text x="740" y="446" text-anchor="middle" class="t">Name, email, phone</text>
  <text x="740" y="464" text-anchor="middle" class="t">Optional new password</text>

  <path d="M740 472 L740 530" class="line"/>
  <path d="M734 521 L740 533 L746 521 Z" class="arrow"/>

  <polygon points="740,535 880,600 740,665 600,600" class="decision"/>
  <text x="740" y="594" text-anchor="middle" class="h">Action?</text>
  <text x="740" y="617" text-anchor="middle" class="t">Cancel or Save</text>

  <!-- Cancel branch -->
  <path d="M600 600 L390 600" class="line"/>
  <path d="M400 594 L388 600 L400 606 Z" class="arrow"/>
  <text x="480" y="587" class="label">Cancel</text>

  <rect x="140" y="560" width="250" height="80" rx="14" class="info"/>
  <text x="265" y="592" text-anchor="middle" class="h">Discard changes</text>
  <text x="265" y="616" text-anchor="middle" class="t">Reload saved Profile</text>

  <!-- Save branch -->
  <path d="M740 665 L740 730" class="line"/>
  <path d="M734 721 L740 733 L746 721 Z" class="arrow"/>
  <text x="754" y="700" class="label">Save</text>

  <polygon points="740,735 880,800 740,865 600,800" class="decision"/>
  <text x="740" y="794" text-anchor="middle" class="h">Valid?</text>
  <text x="740" y="817" text-anchor="middle" class="t">Profile + password policy</text>

  <!-- Invalid -->
  <path d="M600 800 L405 800" class="badLine"/>
  <path d="M415 794 L403 800 L415 806 Z" class="badArrow"/>
  <text x="500" y="787" class="label">No</text>

  <rect x="155" y="760" width="250" height="80" rx="14" class="error"/>
  <text x="280" y="792" text-anchor="middle" class="h">Show field errors</text>
  <text x="280" y="816" text-anchor="middle" class="t">Stay on Profile</text>

  <!-- Valid save -->
  <path d="M880 800 L1045 800" class="goodLine"/>
  <path d="M1035 794 L1047 800 L1035 806 Z" class="goodArrow"/>
  <text x="955" y="787" class="label">Yes</text>

  <rect x="1050" y="760" width="270" height="80" rx="14" class="success"/>
  <text x="1185" y="792" text-anchor="middle" class="h">Update user record</text>
  <text x="1185" y="816" text-anchor="middle" class="t">Audit log, success message</text>

  <path d="M1185 840 L1185 900" class="goodLine"/>
  <path d="M1179 891 L1185 903 L1191 891 Z" class="goodArrow"/>

  <polygon points="1185,905 1325,970 1185,1035 1045,970" class="decision"/>
  <text x="1185" y="964" text-anchor="middle" class="h">Password changed?</text>
  <text x="1185" y="987" text-anchor="middle" class="t">New password saved</text>

  <!-- Password no -->
  <path d="M1045 970 L875 970" class="goodLine"/>
  <path d="M885 964 L873 970 L885 976 Z" class="goodArrow"/>
  <text x="960" y="957" class="label">No</text>
  <rect x="625" y="930" width="250" height="80" rx="14" class="success"/>
  <text x="750" y="962" text-anchor="middle" class="h">Remain on Profile</text>
  <text x="750" y="986" text-anchor="middle" class="t">Show updated data</text>

  <!-- Password yes -->
  <path d="M1325 970 L1400 970 L1400 745 L1350 745 L1350 730" class="badLine"/>
  <path d="M1344 742 L1350 730 L1356 742 Z" class="badArrow"/>
  <text x="1360" y="957" class="label">Yes</text>
  <rect x="1225" y="650" width="250" height="80" rx="14" class="error"/>
  <text x="1350" y="682" text-anchor="middle" class="h">Require sign-in again</text>
  <text x="1350" y="706" text-anchor="middle" class="t">Revoke old sessions/tokens</text>

</svg>
