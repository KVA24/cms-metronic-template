<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360">
  <defs>
    <style>
      .box{fill:#fff;stroke:#cfd8e3;stroke-width:1.5;rx:8}
      .head{fill:#eef8f8;stroke:#8fd2d8;stroke-width:1.5;rx:8}
      .warn{fill:#fff7df;stroke:#e7bd55;stroke-width:1.5;rx:8}
      .ok{fill:#ecfdf3;stroke:#81d8a8;stroke-width:1.5;rx:8}
      .text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#17212f;font-weight:700}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#667085}
      .arrow{stroke:#667085;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#667085"/>
    </marker>
  </defs>
  <rect x="30" y="135" width="145" height="78" class="head"/>
  <text x="68" y="168" class="text">Admin/Ops</text>
  <text x="58" y="190" class="small">Submit form</text>
  <path d="M175 174 H225" class="arrow"/>
  <rect x="225" y="92" width="180" height="164" class="box"/>
  <text x="270" y="124" class="text">CMS Form</text>
  <text x="255" y="152" class="small">Common fields</text>
  <text x="255" y="174" class="small">Locale fields</text>
  <text x="255" y="196" class="small">Icon/order/status</text>
  <text x="255" y="218" class="small">Audit actor</text>
  <path d="M405 174 H455" class="arrow"/>
  <rect x="455" y="62" width="205" height="224" class="warn"/>
  <text x="510" y="94" class="text">Validation</text>
  <text x="485" y="124" class="small">category_code unique</text>
  <text x="485" y="146" class="small">vi-VN name required</text>
  <text x="485" y="168" class="small">display_order numeric</text>
  <text x="485" y="190" class="small">icon format allowed</text>
  <text x="485" y="212" class="small">inactive dependency check</text>
  <text x="485" y="234" class="small">no hard delete if used</text>
  <path d="M660 174 H710" class="arrow"/>
  <rect x="710" y="92" width="170" height="164" class="ok"/>
  <text x="754" y="124" class="text">Save Data</text>
  <text x="740" y="152" class="small">Create/update category</text>
  <text x="740" y="174" class="small">Save translations</text>
  <text x="740" y="196" class="small">Write audit log</text>
  <path d="M880 174 H930" class="arrow"/>
  <rect x="930" y="120" width="88" height="108" class="box"/>
  <text x="948" y="154" class="text">Publish</text>
  <text x="944" y="178" class="small">Available</text>
  <text x="944" y="198" class="small">to consumers</text>
</svg>
