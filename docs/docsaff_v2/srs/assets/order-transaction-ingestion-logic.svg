<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="390" viewBox="0 0 1400 390">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475467"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#98a2b3;stroke-width:1.4;rx:9}
      .brand{fill:#fff7ed;stroke:#fb923c;stroke-width:1.4;rx:9}
      .platform{fill:#eef4ff;stroke:#84adff;stroke-width:1.4;rx:9}
      .decision{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.5}
      .success{fill:#ecfdf3;stroke:#12b76a;stroke-width:1.5;rx:9}
      .exception{fill:#fff1f3;stroke:#f63d68;stroke-width:1.5;rx:9}
      .title{font:700 17px Arial,sans-serif;fill:#101828}
      .text{font:700 13px Arial,sans-serif;fill:#101828}
      .small{font:12px Arial,sans-serif;fill:#475467}
      .label{font:700 10px Arial,sans-serif;fill:#667085}
      .arrow{stroke:#475467;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
      .dashed{stroke:#667085;stroke-width:1.4;fill:none;stroke-dasharray:6 5;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1400" height="390" fill="#fff"/>
  <text x="700" y="34" class="title" text-anchor="middle">ORD-001/002 — Tiếp nhận, validate và deduplicate Order Success</text>

  <rect x="30" y="95" width="190" height="104" class="brand"/>
  <text x="48" y="123" class="text">1. Brand gửi Order Success</text>
  <text x="48" y="148" class="small">Thông tin chung của Order</text>
  <text x="48" y="171" class="small">Danh sách một hoặc nhiều item</text>

  <path d="M220 147 H270" class="arrow"/>

  <rect x="270" y="95" width="190" height="104" class="platform"/>
  <text x="288" y="123" class="text">2. Validate request</text>
  <text x="288" y="148" class="small">Authentication, schema,</text>
  <text x="288" y="171" class="small">Order fields và item fields</text>

  <path d="M460 147 H510" class="arrow"/>

  <rect x="510" y="95" width="190" height="104" class="platform"/>
  <text x="528" y="123" class="text">3. Deduplicate</text>
  <text x="528" y="148" class="small">request_id, brand_order_id</text>
  <text x="528" y="171" class="small">Idempotent khi retry</text>

  <path d="M700 147 H805" class="arrow"/>

  <rect x="805" y="95" width="260" height="104" class="success"/>
  <text x="823" y="123" class="text">4. Chuyển sang ORD-004</text>
  <text x="823" y="148" class="small">Match Click ID</text>
  <text x="823" y="171" class="small">và tiếp tục xử lý Transaction</text>

  <rect x="320" y="275" width="300" height="82" class="box"/>
  <text x="338" y="303" class="text">Trả response idempotent</text>
  <text x="338" y="328" class="small">Không xử lý lại request duplicate</text>

  <rect x="780" y="275" width="330" height="82" class="exception"/>
  <text x="798" y="303" class="text">Ghi Exception và dừng xử lý</text>
  <text x="798" y="328" class="small">Authentication/schema/item không hợp lệ</text>

  <path d="M365 199 V235 H850 V275" class="dashed"/>
  <text x="382" y="225" class="label">VALIDATION FAIL</text>
  <path d="M605 199 V250 H470 V275" class="dashed"/>
  <text x="486" y="241" class="label">DUPLICATE</text>
</svg>
