<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <style>
      .bg{fill:#f6f8fb}
      .title{font:700 28px Arial,sans-serif;fill:#172033}
      .sub{font:14px Arial,sans-serif;fill:#667085}
      .box{fill:#fff;stroke:#cfd8e3;stroke-width:1.7}
      .process{fill:#eefafa;stroke:#0b7185;stroke-width:2}
      .decision{fill:#fff8e8;stroke:#d98a00;stroke-width:2}
      .success{fill:#ecfdf3;stroke:#188456;stroke-width:2}
      .error{fill:#fff3f1;stroke:#cf3f32;stroke-width:2}
      .info{fill:#f0f7ff;stroke:#6d91d0;stroke-width:1.8}
      .h{font:700 16px Arial,sans-serif;fill:#172033}
      .t{font:12px Arial,sans-serif;fill:#52657a}
      .label{font:700 12px Arial,sans-serif;fill:#475467}
      .line{fill:none;stroke:#667085;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
      .goodLine{fill:none;stroke:#188456;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
      .badLine{fill:none;stroke:#cf3f32;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
      .warnLine{fill:none;stroke:#d98a00;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
      .arrow{fill:#667085}
      .goodArrow{fill:#188456}
      .badArrow{fill:#cf3f32}
      .warnArrow{fill:#d98a00}
    </style>
  </defs>

  <rect width="1500" height="980" class="bg"/>
  <text x="60" y="54" class="title">TP-AUTH-001 — Login Logic</text>
  <text x="60" y="82" class="sub">Credential validation, account lock and dashboard redirect</text>

  <!-- Main flow -->
  <rect x="90" y="150" width="210" height="74" rx="14" class="process"/>
  <text x="195" y="181" text-anchor="middle" class="h">Open Login</text>
  <text x="195" y="204" text-anchor="middle" class="t">Tenant Portal login page</text>

  <path d="M300 187 L360 187" class="line"/>
  <path d="M350 181 L362 187 L350 193 Z" class="arrow"/>

  <rect x="365" y="150" width="220" height="74" rx="14" class="box"/>
  <text x="475" y="181" text-anchor="middle" class="h">Enter credential</text>
  <text x="475" y="204" text-anchor="middle" class="t">Username + password</text>

  <path d="M585 187 L645 187" class="line"/>
  <path d="M635 181 L647 187 L635 193 Z" class="arrow"/>

  <rect x="650" y="150" width="240" height="74" rx="14" class="process"/>
  <text x="770" y="181" text-anchor="middle" class="h">Validate login</text>
  <text x="770" y="204" text-anchor="middle" class="t">Credential, user, tenant</text>

  <path d="M890 187 L950 187" class="line"/>
  <path d="M940 181 L952 187 L940 193 Z" class="arrow"/>

  <polygon points="1070,125 1215,187 1070,249 925,187" class="decision"/>
  <text x="1070" y="181" text-anchor="middle" class="h">Valid?</text>
  <text x="1070" y="204" text-anchor="middle" class="t">User and Tenant active</text>

  <!-- Success branch -->
  <path d="M1215 187 L1270 187" class="goodLine"/>
  <path d="M1260 181 L1272 187 L1260 193 Z" class="goodArrow"/>
  <text x="1238" y="174" class="label">Yes</text>

  <rect x="1275" y="150" width="170" height="74" rx="14" class="success"/>
  <text x="1360" y="181" text-anchor="middle" class="h">Open Dashboard</text>
  <text x="1360" y="204" text-anchor="middle" class="t">Reset count, create session</text>

  <!-- Existing locked branch -->
  <path d="M1070 249 L1070 310" class="badLine"/>
  <path d="M1064 301 L1070 313 L1076 301 Z" class="badArrow"/>
  <text x="1080" y="284" class="label">Locked</text>

  <rect x="950" y="315" width="240" height="74" rx="14" class="error"/>
  <text x="1070" y="346" text-anchor="middle" class="h">Reject sign-in</text>
  <text x="1070" y="369" text-anchor="middle" class="t">Show account locked</text>

  <!-- Invalid branch -->
  <path d="M925 187 L770 187 L770 285" class="warnLine"/>
  <path d="M764 276 L770 288 L776 276 Z" class="warnArrow"/>
  <text x="835" y="174" class="label">No</text>

  <polygon points="770,290 900,350 770,410 640,350" class="decision"/>
  <text x="770" y="344" text-anchor="middle" class="h">Username exists?</text>
  <text x="770" y="367" text-anchor="middle" class="t">Normalized username</text>

  <!-- Username not found -->
  <path d="M640 350 L455 350" class="warnLine"/>
  <path d="M465 344 L453 350 L465 356 Z" class="warnArrow"/>
  <text x="540" y="337" class="label">No</text>

  <rect x="210" y="315" width="240" height="74" rx="14" class="error"/>
  <text x="330" y="346" text-anchor="middle" class="h">Rate limit</text>
  <text x="330" y="369" text-anchor="middle" class="t">Security log only</text>

  <!-- Wrong password -->
  <path d="M770 410 L770 475" class="badLine"/>
  <path d="M764 466 L770 478 L776 466 Z" class="badArrow"/>
  <text x="782" y="446" class="label">Yes</text>

  <rect x="650" y="480" width="240" height="74" rx="14" class="process"/>
  <text x="770" y="511" text-anchor="middle" class="h">Increase fail count</text>
  <text x="770" y="534" text-anchor="middle" class="t">Wrong password</text>

  <path d="M770 554 L770 620" class="line"/>
  <path d="M764 611 L770 623 L776 611 Z" class="arrow"/>

  <polygon points="770,625 900,685 770,745 640,685" class="decision"/>
  <text x="770" y="679" text-anchor="middle" class="h">Count = 5?</text>
  <text x="770" y="702" text-anchor="middle" class="t">Consecutive failures</text>

  <!-- Fail 1-4 -->
  <path d="M640 685 L455 685" class="badLine"/>
  <path d="M465 679 L453 685 L465 691 Z" class="badArrow"/>
  <text x="540" y="672" class="label">No, 1–4</text>

  <rect x="210" y="650" width="240" height="74" rx="14" class="error"/>
  <text x="330" y="681" text-anchor="middle" class="h">Keep status</text>
  <text x="330" y="704" text-anchor="middle" class="t">Show login error</text>

  <!-- Fail 5 -->
  <path d="M900 685 L1010 685" class="badLine"/>
  <path d="M1000 679 L1012 685 L1000 691 Z" class="badArrow"/>
  <text x="935" y="672" class="label">Yes</text>

  <rect x="1015" y="650" width="250" height="74" rx="14" class="error"/>
  <text x="1140" y="681" text-anchor="middle" class="h">Lock account</text>
  <text x="1140" y="704" text-anchor="middle" class="t">Revoke session, audit log</text>

  <path d="M1140 724 L1140 785" class="badLine"/>
  <path d="M1134 776 L1140 788 L1146 776 Z" class="badArrow"/>

  <rect x="1015" y="790" width="250" height="74" rx="14" class="info"/>
  <text x="1140" y="821" text-anchor="middle" class="h">Users shows Locked</text>
  <text x="1140" y="844" text-anchor="middle" class="t">Account settings &gt; Users</text>

  <rect x="650" y="805" width="240" height="74" rx="14" class="error"/>
  <text x="770" y="836" text-anchor="middle" class="h">Locked message</text>
  <text x="770" y="859" text-anchor="middle" class="t">Contact Tenant Admin</text>

  <path d="M1015 827 L890 827" class="badLine"/>
  <path d="M900 821 L888 827 L900 833 Z" class="badArrow"/>
  <path d="M1070 389 L1070 425 L1345 425 L1345 920 L770 920 L770 879" class="badLine"/>
  <path d="M764 891 L770 879 L776 891 Z" class="badArrow"/>
</svg>
