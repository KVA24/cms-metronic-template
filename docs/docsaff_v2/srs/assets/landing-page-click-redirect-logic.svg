  <defs><style>.box{fill:#fff;stroke:#cfd8e3;stroke-width:1.5;rx:8}.head{fill:#eef8f8;stroke:#8fd2d8;stroke-width:1.5;rx:8}.warn{fill:#fff7df;stroke:#e7bd55;stroke-width:1.5;rx:8}.text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#17212f;font-weight:700}.small{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#667085}.arrow{stroke:#667085;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#667085"/></marker></defs>
